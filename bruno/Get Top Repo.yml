info:
  name: Get Top Repo
  type: http
  seq: 4

http:
  method: GET
  url: https://api.github.com/search/repositories?q=stars:>1 archived:false&per_page=5&sort=stars&order=desc
  headers:
    - name: Accept
      value: application/vnd.github+json
    - name: X-GitHub-Api-Version
      value: 2026-03-10
  params:
    - name: q
      value: stars:>1 archived:false
      type: query
    - name: per_page
      value: "5"
      type: query
    - name: sort
      value: stars
      type: query
    - name: order
      value: desc
      type: query
    - name: page
      value: "1"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
